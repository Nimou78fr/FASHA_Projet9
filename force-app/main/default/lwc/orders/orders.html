<template>
    <lightning-card
        title="Commandes du compte"
        icon-name="standard:orders">

        <div class="slds-p-around_medium">

            <!-- Erreur technique lors de l'appel Apex -->
            <template lwc:if={hasError}>
                <div
                    class="slds-notify slds-notify_alert slds-theme_error"
                    role="alert">

                    <span class="slds-assistive-text">
                        Erreur
                    </span>

                    <p>
                        Erreur lors de la récupération
                        des commandes du compte.
                    </p>
                </div>
            </template>

            <!-- Des commandes existent avec un total supérieur à zéro -->
            <template lwc:elseif={hasActivatedOrders}>
                <div
                    class="slds-notify slds-notify_alert slds-theme_success"
                    role="status">

                    <span class="slds-assistive-text">
                        Succès
                    </span>

                    <p>
                        Total des commandes :

                        <strong class="slds-m-left_x-small">
                            <lightning-formatted-number
                                value={sumOrdersOfCurrentAccount}
                                format-style="currency"
                                currency-code="EUR"
                                currency-display-as="symbol">
                            </lightning-formatted-number>
                        </strong>
                    </p>
                </div>
            </template>

            <!-- Aucune commande ou total égal à zéro -->
            <template lwc:else>
                <div
                    class="slds-notify slds-notify_alert slds-theme_error"
                    role="alert">

                    <span class="slds-assistive-text">
                        Erreur
                    </span>

                    <p>
                        Erreur, pas de commandes rattachées à ce compte
                        ou le montant des commandes est égal à zéro.
                    </p>
                </div>
            </template>

        </div>
    </lightning-card>
</template>
